apiVersion: apps/v1
kind: Deployment
metadata:
  name: processador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processador
  template:
    metadata:
      labels:
        app: processador
    spec:
      containers:
      - name: processador
        image: processador:latest
        imagePullPolicy: Never
        env:
        - name: DASHBOARD_HOST
          value: "dashboard"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: processador
spec:
  selector:
    app: processador
  ports:
  - port: 5000
    targetPort: 5000